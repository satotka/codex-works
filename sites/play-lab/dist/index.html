<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PLAY LAB — ミニゲーム実験場</title><meta name="description" content="ちょっと遊ぶ。ちょっと試す。反射神経、記憶カード、数字パズルを楽しむ自分だけの実験場。"><link rel="stylesheet" href="style.css"></head>
<body><header><a href="#" class="brand">✳ PLAY LAB<span>遊びの実験場</span></a><span class="badge">PERSONAL EXPERIMENT / 001</span></header><main><section class="hero"><div class="eyebrow">小さなゲーム、大きな好奇心。</div><h1>ちょっと遊ぶ。<br>ちょっと<span>試す。</span></h1><p>ここは、自分だけの遊びの実験場。<br>考える、覚える、反応する。気になるゲームからどうぞ。</p><div class="hero-meta"><span>● 3 GAMES READY</span><span>無料 · インストール不要</span></div><div class="orbit" aria-hidden="true"><div class="cross">✳</div><span>PRESS PLAY<br>STAY CURIOUS</span></div></section><section class="collection"><div class="section-title"><h2>ゲームを選ぶ <small>THE COLLECTION</small></h2><span>01 — 03</span></div><div class="cards"><button class="card" data-game="reaction"><div class="card-art art1"><span class="number">01 / REFLEX</span><span class="symbol">ϟ</span><span class="tag">約30秒</span></div><div class="card-body"><span class="category">反射神経</span><h3>クイック・タップ <span>↗</span></h3><p>緑になった瞬間にタップ。<br>あなたの反応は何ミリ秒？</p><div class="card-foot"><span id="best-reaction">BEST —</span><b>遊ぶ →</b></div></div></button><button class="card" data-game="memory"><div class="card-art art2"><span class="number">02 / MEMORY</span><span class="symbol">▦</span><span class="tag">約1分</span></div><div class="card-body"><span class="category">記憶力</span><h3>ペア・ファインダー <span>↗</span></h3><p>めくって、覚えて、ペアを発見。<br>少ない手数で全部そろえよう。</p><div class="card-foot"><span id="best-memory">BEST —</span><b>遊ぶ →</b></div></div></button><button class="card" data-game="puzzle"><div class="card-art art3"><span class="number">03 / PUZZLE</span><span class="symbol">1 2<br>3 ◻</span><span class="tag">じっくり</span></div><div class="card-body"><span class="category">思考力</span><h3>スライド・エイト <span>↗</span></h3><p>数字を動かして、1から8へ。<br>小さな盤面にひらめきを。</p><div class="card-foot"><span id="best-puzzle">BEST —</span><b>遊ぶ →</b></div></div></button></div></section><section class="note"><span>↳ LAB NOTE</span><p>遊んでみて、気づいて、また試す。<br>この実験場は、ここから少しずつ育っていきます。</p><span class="note-mark">✳</span></section></main><footer><span>PLAY LAB / 自分だけの実験場</span><span>記録はこのブラウザに保存されます</span></footer><dialog id="game-dialog"><div class="dialog-head"><span id="game-type"></span><button id="close" aria-label="ゲームを閉じる">✕</button></div><h2 id="game-title"></h2><p id="rules"></p><div id="game-area"></div><p id="status" aria-live="polite"></p><button id="restart" class="primary">もう一度遊ぶ ↻</button></dialog><script src="app.js"></script></body></html>
